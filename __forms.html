<!DOCTYPE html>
<html><body>
<!-- Static stub so Netlify Forms detects the contact form at deploy time. -->
<form name="join-the-mission" data-netlify="true" netlify-honeypot="company-website" hidden>
  <input type="hidden" name="form-name" value="join-the-mission" />
  <input name="company-website" /><input name="path" /><input name="name" /><input type="email" name="email" />
  <select name="role"><option>Researcher</option></select><input name="organisation" /><textarea name="message"></textarea><input type="checkbox" name="consent" />
</form>
</body></html>
